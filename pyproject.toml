[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieveros"
version = "1.0.0"
description = "RetrieverOS — grounded workspace-document Q&A with hybrid retrieval and citation checks."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "cryptography>=43",
    "faiss-cpu>=1.8",
    "fastapi>=0.115",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "numpy>=1.26",
    "PyJWT[crypto]>=2.10",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.14,<2",
    "rank-bm25>=0.2.2",
    "redis>=5,<7",
    "requests>=2.32",
    "sentence-transformers>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
rag-pipeline-seed = "rag_pipeline.seed:main"
rag-pipeline-reindex = "rag_pipeline.reindex:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "langgraph-api>=0.17.0",
    "langgraph-cli[inmem]>=0.1.71",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
