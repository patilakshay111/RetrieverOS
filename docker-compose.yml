services:
  api:
    build: .
    command: uvicorn rag_pipeline.api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATA_DIR: /app/data/runtime
    ports:
      - "8000:8000"
    volumes:
      - rag-data:/app/data/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  dashboard:
    build: .
    command: streamlit run src/rag_pipeline/ui.py --server.address 0.0.0.0 --server.port 8501
    environment:
      STREAMLIT_API_URL: http://api:8000
      STREAMLIT_API_KEY: ${API_KEY}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  rag-data:
